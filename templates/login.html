{% extends 'base.html'%}
{% block title %}
<title>Login</title>
{% endblock %}

{% block content %}
    <h1>Login</h1>
    <form method="POST" id="login-form">
        <input type="text" name="login-email" placeholder="example@email.com">
        <br><br>
        <input type="text" name="login-name" placeholder="E.g. John Smith">
        <br><br>
        <input type="password" name="login-password" placeholder="Enter a password">
        <br><br>
        <button type="submit" id="login-button">Login</button>
    </form>
    <h4>Don't have an account? Register <a href="{{ url_for('register')}}">here</a></h4>
{% endblock %}
